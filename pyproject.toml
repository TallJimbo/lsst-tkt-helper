[tool.ruff]
line-length = 110
target-version = "py313"
exclude = [
    "__init__.py",

    # Scratch space and the pinned superpowers submodule are not part of this
    # package; keep ruff out of them.
    "investigations",
    "superpowers",
]

[tool.ruff.lint]
ignore = [
    "N802",
    "N803",
    "N806",
    "N812",
    "N815",
    "N816",
    "N999",
    "D107",
    "D105",
    "D102",
    "D104",
    "D100",
    "D200",
    "D205",
    "D400",
]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "N",  # pep8-naming
    "W",  # pycodestyle
    "D",  # pydocstyle
    "I",  # isort
    "C4",  # comprehensions
    "UP",  # pyupgrade
    "RUF022",  # sort __all__
]
extend-select = [
    "RUF100", # Warn about unused noqa
]

# FastMCP tool docstrings (in mcp_server.py) are the agent-facing MCP
# contract: what matters is that they render well to consuming agents, not
# that they follow numpydoc. Exempt the file from the numpydoc content rules
# (D4). Internal helpers in the same file remain well-documented by hand.
[tool.ruff.lint.per-file-ignores]
"tkt/mcp_server.py" = ["D4"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 79

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 79

[tool.numpydoc_validation]
checks = [
    "all",  # All except the rules listed below.
    "SA01",  # See Also section.
    "EX01",  # Example section.
    "SS06",  # Summary can go into second line.
    "GL01",  # Summary text can start on same line as """
    "GL08",  # Do not require docstring.
    "ES01",  # No extended summary required.
    "RT01",  # Unfortunately our @property trigger this.
    "RT02",  # Does not want named return value. DM style says we do.
    "SS05",  # pydocstyle is better at finding infinitive verb.
    "GL03",  # ruff format of docstrings disagrees.
]
exclude = [
    "^test_.*",  # Do not test docstrings in test code.
    '^__init__$',
    '\._[a-zA-Z_]+$',  # Private methods.
]

[tool.mypy]
warn_unused_configs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["git"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Keep pytest from descending into scratch space or the pinned submodule.
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "investigations",
    "superpowers",
]
